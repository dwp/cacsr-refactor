{% extends "layouts/agent-main.html" %}

{% block pageTitle %}
  Question page template – {{ serviceName }} – GOV.UK Prototype Kit
{% endblock %}

{% block content %}



  
      <form class="form" action="search-result" method="post">

<div class="govuk-form-group">
  <h1 class="govuk-label-wrapper">
    <label class="govuk-label govuk-label--l" for="event-name">
      Search for carer
    </label>
     </h1> 
     
<div class="govuk-form-group">
      <label class="govuk-label moj-search__label" for="search">
        Enter carer's National Insurance number
      </label>
      <input class="govuk-input govuk-input--width-10 moj-search__input " id="search" name="carernino" type="search" aria-describedby="search-hint" value="">
       <button type="submit" class="govuk-button govuk-button--secondary" href="search-result" data-module="govuk-button" style="margin-left: 6px;" data-govuk-button-init="">
        Search
      </button>
    </div>


    </div>
  </div>

    </form>

{% endblock %}
